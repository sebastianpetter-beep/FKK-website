<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#087b35"><title>FKK Adventsmarktkasse</title><style>:root{font-family:system-ui,sans-serif;color:#17301e;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}header{background:#076c32;color:#fff;padding:15px;text-align:center}header img{width:70px;height:70px;object-fit:contain;border-radius:50%}h1{font-size:24px;margin:6px}main{max-width:780px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 20px #1232}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button,input,select{font:inherit;border:1px solid #b9c7ba;border-radius:12px;padding:13px}button{cursor:pointer}button.product{background:#e7f4e8;min-height:105px;font-size:18px;font-weight:700}button.primary{background:#087b35;color:#fff;font-weight:700;width:100%}button:disabled{opacity:.5;cursor:not-allowed}input{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}.qty{display:flex;gap:8px;align-items:center}.qty button{padding:6px 13px}#total{font-size:30px;font-weight:800}.note{background:#fff3d0;padding:12px;border-radius:10px}.muted{color:#667}.hidden{display:none}@media(max-width:450px){.card{padding:12px}.grid{gap:8px}button.product{font-size:15px}}</style><style>
header{display:none!important}main{max-width:1100px;padding:8px 12px}.card{padding:12px;margin:8px 0;border-radius:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}button.product{min-height:64px;padding:9px 6px;font-size:14px;line-height:1.3;color:#084d27;border:1px solid #aad0b4}button.product small{display:block;font-size:12px;margin-top:4px;color:#42664d}.note{padding:7px 10px;font-size:13px}.pos-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.pos-head strong{font-size:19px;color:#075b2a}.pos-head button{padding:7px}.checkout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.keypad button{background:#f1f7f0;font-size:23px;font-weight:750;padding:11px 4px;border:1px solid #bad4c0}.keypad button:active{background:#ffdc44}.return-button{background:#ffe77b;border:1px solid #d1ae32;font-weight:800;padding:11px}.total-line{background:#e9f6e9;border-radius:10px;padding:9px}.total-line #total{font-size:27px}.change-line{background:#fff3ca;border-radius:10px;padding:10px}.change-line strong{font-size:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:8px}#given{font-size:23px;font-weight:750;text-align:right;background:#fff;border:2px solid #087b35}@media(max-width:650px){.checkout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}button.product{font-size:12px;min-height:62px}button.product small{font-size:11px}}
</style></head><body><header><img src="/assets/fkk-logo.jpeg" alt="FKK Logo"><h1>🎄 FKK Adventsmarktkasse</h1><div>Wir leben Karneval · Wesel</div></header><main><div class="note" id="status">Die Online-Kasse wird eingerichtet. Es sind noch keine echten Buchungen möglich.</div><section class="card" id="login"><h2>Kassenzugang</h2><label>Gemeinsame Kassen-PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="PIN eingeben"></label><p><button class="primary" id="loginBtn">Kasse öffnen</button></p></section><section class="hidden" id="pos">
<section class="card"><div class="pos-head"><strong>🎄 FKK · Verkaufskasse</strong><button id="logout">Abmelden</button></div><div class="grid" id="products" style="margin-top:12px"></div></section>
<div class="checkout"><section class="card"><div class="pos-head"><strong>Warenkorb</strong><button id="clear">Leeren</button></div><div id="lines" style="min-height:45px">Noch keine Artikel</div><div class="row"><button class="return-button" id="retplus">↩ Pfandrückgabe +1</button><div class="qty"><button id="retminus">−</button><strong id="retcount">0</strong></div></div><div class="row total-line"><strong>Zu zahlen</strong><strong id="total">0,00 €</strong></div></section>
<section class="card"><strong>💶 Bezahlung</strong><label style="display:block;margin:10px 0">Kunde gibt (€)<input id="given" inputmode="none" readonly placeholder="0,00"></label><div class="keypad" id="keypad"></div><div class="row change-line"><strong id="changeLabel">Wechselgeld / Auszahlung</strong><strong id="change">0,00 €</strong></div><button class="primary" id="pay" disabled>✓ Buchung abschließen</button></section></div></section></main><script>const API='https://fkk-mitgliedsantrag-backend.onrender.com';
let authToken=sessionStorage.getItem('fkk_kasse_token')||'',products=[],cart={},returns=0,busy=false,refundCents=0,givenDigits='';
const $=id=>document.getElementById(id),eur=c=>(c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
async function request(path,options={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(authToken?{'Authorization':'Bearer '+authToken}:{})},...options});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Server nicht erreichbar');return j}
function message(t){$('status').textContent=t}
async function open(){try{const s=await request('/api/adventskasse/state');products=s.products;refundCents=s.return_deposit_cents||0;$('login').classList.add('hidden');$('pos').classList.remove('hidden');message('Kasse verbunden · Buchungen werden zentral gespeichert');render()}catch(e){message('Verbindung fehlgeschlagen: '+e.message);$('pay').disabled=true}}
$('loginBtn').onclick=async()=>{try{const r=await request('/api/adventskasse/login',{method:'POST',body:JSON.stringify({pin:$('pin').value})});authToken=r.token;sessionStorage.setItem('fkk_kasse_token',authToken);$('pin').value='';await open()}catch(e){message(e.message)}};
$('logout').onclick=()=>{sessionStorage.removeItem('fkk_kasse_token');location.reload()};
$('clear').onclick=()=>{cart={};returns=0;givenDigits='';render()};
$('retplus').onclick=()=>{if(!refundCents){message('Bitte zuerst bei einem Artikel den Pfandbetrag in der Vorstandszentrale hinterlegen.');return}returns++;render()};
$('retminus').onclick=()=>{returns=Math.max(0,returns-1);render()};
const keys=['1','2','3','4','5','6','7','8','9','C','0','⌫'];
for(const key of keys){const b=document.createElement('button');b.textContent=key;b.type='button';b.onclick=()=>{if(key==='C')givenDigits='';else if(key==='⌫')givenDigits=givenDigits.slice(0,-1);else if(givenDigits.length<8)givenDigits+=key;render()};$('keypad').append(b)}
function render(){
 $('products').replaceChildren();
 products.forEach(p=>{const b=document.createElement('button');b.className='product';b.type='button';b.textContent=p.name;const price=document.createElement('small');price.textContent=eur(p.price_cents+p.deposit_cents)+(p.deposit_cents?' inkl. Pfand':'');b.append(price);b.onclick=()=>{cart[p.id]=(cart[p.id]||0)+1;render()};$('products').append(b)});
 $('lines').replaceChildren();let total=-returns*refundCents;
 for(const [id,qty] of Object.entries(cart)){if(!qty)continue;const p=products.find(p=>p.id===id);if(!p)continue;total+=(p.price_cents+p.deposit_cents)*qty;const row=document.createElement('div');row.className='row';const title=document.createElement('span');title.textContent=qty+' × '+p.name+' · '+eur((p.price_cents+p.deposit_cents)*qty);const buttons=document.createElement('div');buttons.className='qty';for(const [label,delta] of [['−',-1],['+',1]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{cart[id]=Math.max(0,qty+delta);render()};buttons.append(b)}row.append(title,buttons);$('lines').append(row)}
 $('retcount').textContent=returns;$('total').textContent=eur(total);const given=Number(givenDigits||0);$('given').value=eur(given);$('changeLabel').textContent=total<0?'An Kunden auszahlen':'Wechselgeld';$('change').textContent=eur(total<0?-total:Math.max(0,given-total));$('pay').disabled=busy||(!Object.values(cart).some(Boolean)&&!returns)||(total>=0&&given<total);
}
$('pay').onclick=async()=>{if(busy)return;busy=true;render();const id=crypto.randomUUID(),items=Object.entries(cart).filter(x=>x[1]>0).map(([id,qty])=>({id,qty}));try{await request('/api/adventskasse/sale',{method:'POST',body:JSON.stringify({stand:'food',items,returns,given_cents:Number(givenDigits||0),request_id:id})});cart={};returns=0;givenDigits='';message('✓ Buchung erfolgreich auf dem Server gespeichert')}catch(e){message('Buchung NICHT bestätigt: '+e.message+' · Bitte Status vor erneutem Kassieren prüfen')}finally{busy=false;render()}};
if(authToken)open();</script></body></html>

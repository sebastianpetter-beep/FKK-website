<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#087b35"><title>FKK Adventsmarktkasse</title><style>:root{font-family:system-ui,sans-serif;color:#17301e;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}header{background:#076c32;color:#fff;padding:15px;text-align:center}header img{width:70px;height:70px;object-fit:contain;border-radius:50%}h1{font-size:24px;margin:6px}main{max-width:780px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 20px #1232}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button,input,select{font:inherit;border:1px solid #b9c7ba;border-radius:12px;padding:13px}button{cursor:pointer}button.product{background:#e7f4e8;min-height:105px;font-size:18px;font-weight:700}button.primary{background:#087b35;color:#fff;font-weight:700;width:100%}button:disabled{opacity:.5;cursor:not-allowed}input{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}.qty{display:flex;gap:8px;align-items:center}.qty button{padding:6px 13px}#total{font-size:30px;font-weight:800}.note{background:#fff3d0;padding:12px;border-radius:10px}.muted{color:#667}.hidden{display:none}@media(max-width:450px){.card{padding:12px}.grid{gap:8px}button.product{font-size:15px}}</style></head><body><header><img src="/assets/fkk-logo.jpeg" alt="FKK Logo"><h1>🎄 FKK Adventsmarktkasse</h1><div>Wir leben Karneval · Wesel</div></header><main><div class="note" id="status">Die Online-Kasse wird eingerichtet. Es sind noch keine echten Buchungen möglich.</div><section class="card" id="login"><h2>Kassenzugang</h2><label>Gemeinsame Kassen-PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="PIN eingeben"></label><p><button class="primary" id="loginBtn">Kasse öffnen</button></p></section><section class="hidden" id="pos"><section class="card"><label>Verkaufsstand <select id="stand"><option value="food">Stand 1 · Speisen</option><option value="drink">Stand 2 · Getränke</option></select></label><div class="grid" id="products" style="margin-top:15px"></div></section><section class="card"><h2>Warenkorb</h2><div id="lines">Noch keine Artikel</div><div class="row"><strong>Pfandrückgabe (Becher)</strong><div class="qty"><button id="retminus">−</button><span id="retcount">0</span><button id="retplus">+</button></div></div><hr><div class="row"><strong>Zu zahlen</strong><span id="total">0,00 €</span></div><label>Gegeben in Euro<input id="given" type="number" step=".01" min="0" placeholder="0,00"></label><div class="row"><strong>Wechselgeld</strong><strong id="change">0,00 €</strong></div><button class="primary" id="pay" disabled>Verkauf buchen</button><p><button id="clear">Warenkorb leeren</button> <button id="logout">Abmelden</button></p></section></section></main><script>
const API='https://fkk-mitgliedsantrag-backend.onrender.com';let authToken=sessionStorage.getItem('fkk_kasse_token')||'';let products=[],stands=[],cart={},returns=0,busy=false;
const $=id=>document.getElementById(id),eur=c=>(c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const request=async(path,options={})=>{const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(authToken?{'Authorization':'Bearer '+authToken}:{})},...options});const j=await r.json();if(!r.ok)throw Error(j.error||'Server nicht erreichbar');return j};
function message(t){$('status').textContent=t}
async function open(){try{const s=await request('/api/adventskasse/state');products=s.products;stands=s.stands;$('login').classList.add('hidden');$('pos').classList.remove('hidden');message('Verbunden · Verkäufe werden zentral gespeichert');render()}catch(e){message('Keine Verbindung zur sicheren Kassen-Datenbank. Buchungen sind gesperrt.');$('pay').disabled=true}}
$('loginBtn').onclick=async()=>{try{const result=await request('/api/adventskasse/login',{method:'POST',body:JSON.stringify({pin:$('pin').value})});authToken=result.token;sessionStorage.setItem('fkk_kasse_token',authToken);$('pin').value='';await open()}catch(e){message(e.message)}};
$('stand').onchange=()=>{cart={};returns=0;render()};$('given').oninput=render;
$('retminus').onclick=()=>{returns=Math.max(0,returns-1);render()};$('retplus').onclick=()=>{returns++;render()};
$('clear').onclick=()=>{cart={};returns=0;$('given').value='';render()};
$('logout').onclick=async()=>{authToken='';sessionStorage.removeItem('fkk_kasse_token');location.reload()};
function render(){const stand=$('stand').value, list=products.filter(p=>p.stand===stand);$('products').innerHTML='';list.forEach(p=>{const b=document.createElement('button');b.className='product';b.textContent=p.name+' · '+eur(p.price_cents+p.deposit_cents)+(p.deposit_cents?' inkl. Pfand':'');b.onclick=()=>{cart[p.id]=(cart[p.id]||0)+1;render()};$('products').append(b)});$('lines').innerHTML='';let sum=-returns*((stands.find(s=>s.id===stand)||{}).return_deposit_cents||0);Object.entries(cart).forEach(([id,qty])=>{if(!qty)return;const p=products.find(x=>x.id===id);if(!p)return;sum+=(p.price_cents+p.deposit_cents)*qty;const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=p.name+' · '+eur((p.price_cents+p.deposit_cents)*qty);const q=document.createElement('div');q.className='qty';const minus=document.createElement('button');minus.textContent='−';minus.onclick=()=>{cart[id]=Math.max(0,qty-1);render()};const plus=document.createElement('button');plus.textContent='+';plus.onclick=()=>{cart[id]++;render()};q.append(minus,document.createTextNode(String(qty)),plus);row.append(name,q);$('lines').append(row)});$('retcount').textContent=returns;$('total').textContent=eur(sum);const given=Math.round(Number($('given').value)*100);$('change').textContent=eur(Math.max(0,given-sum));$('pay').disabled=busy||(!Object.values(cart).some(Boolean)&&!returns)||!Number.isFinite(given)||given<Math.max(0,sum)}
$('pay').onclick=async()=>{busy=true;render();const id=crypto.randomUUID();const items=Object.entries(cart).filter(x=>x[1]>0).map(([id,qty])=>({id,qty}));try{await request('/api/adventskasse/sale',{method:'POST',body:JSON.stringify({stand:$('stand').value,items,returns,given_cents:Math.round(Number($('given').value)*100),request_id:id})});cart={};returns=0;$('given').value='';message('Verkauf erfolgreich auf dem Server gespeichert');}catch(e){message('Buchung NICHT bestätigt: '+e.message+' · Bitte nicht erneut kassieren, bevor der Status geprüft ist')}finally{busy=false;render()}};
if(authToken)open();</script></body></html>
